# This is the "human-readable" name of the workflow, which will show up in your GitHub Actions tab.
name: Build and Deploy to AWS ECR & Lambda

# --- Trigger ---
# This workflow is "paused" and set to a MANUAL trigger.
# It will NOT run on a 'push'. It will only run when you
# go to the GitHub "Actions" tab and manually click "Run workflow".
on:
  workflow_dispatch:

# --- Jobs ---
jobs:
  build-and-deploy:
    # Use a standard, clean Linux virtual machine
    runs-on: ubuntu-latest

    # --- Steps ---
    steps:
      # Step 1: Get the code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials from GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # These are securely stored in GitHub > Settings > Secrets > Actions
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # This must be the AWS region for your ECR and Lambda
          aws-region: "YOUR_AWS_REGION" # e.g., us-east-1

      # Step 3: Log in to Amazon ECR (Private)
      - name: Log in to Amazon ECR (Private)
        run: |
          aws ecr get-login-password --region YOUR_AWS_REGION | docker login --username AWS --password-stdin YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_AWS_REGION.amazonaws.com

      # Step 4: Build, Tag, and Push Image to Private ECR
      - name: Build, Tag, and Push Image to Private ECR
        env:
          # This is the full URI for your private ECR repository
          ECR_REPO_URI: "YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_AWS_REGION.amazonaws.com/YOUR_REPO_NAME"
        run: |
          echo "Building and tagging image: $ECR_REPO_URI:latest"
          docker build -t $ECR_REPO_URI:latest .
          
          echo "Pushing image to ECR..."
          docker push $ECR_REPO_URI:latest

      # Step 5: Update the Lambda Function
      - name: Update Lambda Function Code
        env:
          ECR_REPO_URI_WITH_TAG: "YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_AWS_REGION.amazonaws.com/YOUR_REPO_NAME:latest"
          LAMBDA_FUNCTION_NAME: "YOUR_LAMBDA_FUNCTION_NAME"
          LAMBDA_REGION: "YOUR_AWS_REGION"
        run: |
          echo "Updating Lambda Function: $LAMBDA_FUNCTION_NAME"
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --image-uri $ECR_REPO_URI_WITH_TAG \
            --region $LAMBDA_REGION
          echo "Lambda update complete"